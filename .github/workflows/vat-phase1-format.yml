name: VAT Phase 1 formatting (temporary)
on:
  push:
    branches:
      - feat/vat-filing-phase1-claim-period
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Auto-format changed files
        run: |
          python -m pip install pre-commit ruff
          git fetch origin version-15-hotfix:refs/remotes/origin/version-15-hotfix
          git diff --name-only --diff-filter=ACMR origin/version-15-hotfix...HEAD > /tmp/phase1-files
          grep -E '\.(py|js|json|yaml|yml|md)$' /tmp/phase1-files > /tmp/phase1-formattable || true
          if [ -s /tmp/phase1-formattable ]; then
            xargs -r pre-commit run --files < /tmp/phase1-formattable || true
            xargs -r ruff check --fix --unsafe-fixes < <(grep '\.py$' /tmp/phase1-formattable) || true
            xargs -r ruff format < <(grep '\.py$' /tmp/phase1-formattable) || true
            xargs -r pre-commit run --files < /tmp/phase1-formattable || true
          fi
        shell: bash
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only --diff-filter=M > /tmp/modified
          if [ -s /tmp/modified ]; then
            xargs -r git add -- < /tmp/modified
            if ! git diff --cached --quiet; then
              git commit -m "style: format vat filing sources"
              git push
            fi
          fi
