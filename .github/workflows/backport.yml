name: Backport

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport PR
    if: >
      github.event.pull_request.merged == true
      && contains(join(github.event.pull_request.labels.*.name, ','), 'backport-to-')
      && (
        github.event.action == 'closed'
        || (
          github.event.action == 'labeled'
          && startsWith(github.event.label.name, 'backport-to-')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create backport PR(s)
        uses: korthout/backport-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_pattern: "^backport-to-(.+)$"
          merge_commits: "skip"
          experimental: |
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
          pull_title: "[Backport ${target_branch}] ${pull_title}"
          pull_description: |
            Backport of #${pull_number} to `${target_branch}`.

            If conflicts are present, resolve them directly in this draft backport PR and
            mark it ready for review once the conflict resolution is complete.

            ---

            ${pull_description}
          copy_requested_reviewers: true
          copy_assignees: true
          copy_labels_pattern: "^(?!backport-to-)"
          auto_merge_enabled: ${{ contains(join(github.event.pull_request.labels.*.name, ','), 'backport-auto-merge') }}

      - name: Report backport failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullNumber,
              body: [
                "⚠️ **Backport automation failed.**",
                "",
                "Conflict handling is configured to create a draft backport PR when a cherry-pick conflict occurs.",
                "If no draft PR was created, inspect this workflow run for an infrastructure, permissions, or target-branch error.",
              ].join("\n"),
            });
