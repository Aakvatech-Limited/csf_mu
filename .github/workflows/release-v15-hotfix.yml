name: Release v15 hotfix snapshot

on:
  push:
    branches:
      - version-15-hotfix
    paths:
      - csf_mu/__init__.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csf-mu-v15-hotfix-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish v15 hotfix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify release source and declared version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/version-15-hotfix"
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("csf_mu/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'(?m)^__version__\s*=\s*["\x27](15\.\d+\.\d+)["\x27]$', source)
          if not match:
              raise SystemExit("The declared app version must match 15.x.x")
          print(match.group(1))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag immutability
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "$TAG")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Existing tag $TAG points to $existing, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi

      - name: Create annotated Git tag if absent
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name "Aakvatech Release Bot"
            git config user.email "info@aakvatech.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "CSF MU $TAG - v15 hotfix release"
            git push origin "$TAG"
          fi

      - name: Create GitHub pre-release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --title "CSF MU $VERSION (v15 hotfix)" \
            --prerelease \
            --notes "Release candidate from version-15-hotfix (testing branch). No production branch promotion. Includes VAT Return Filing document, dated input VAT claims, monthly VAT Return Type backfill, recovery controls, filing breakdowns, Excel/print exports, and finance Markdown documentation. MRA portal integration is deferred pending its announced 2027 changes. Verify installation and VAT totals on a test site before production promotion."
